order: 70
announcements:
  - id: hud
    title: 信息可视化
    pages:
      - |-
        瞄准方块时，
        左上角会显示方块名字、
        当前能不能采集，
        以及至少需要什么工具。

        需要的工具会用图标
        显示在文字左边。
      - |-
        瞄准生物时，
        会显示名字、血条
        和身上的状态。
        血条后面的一小段
        是刚刚受到的伤害。
      - |-
        对生物造成伤害时，
        会跳出伤害数字。
        治疗时也会跳出绿色数字。

        /xxksh toggle
        可以随时关掉或打开。
